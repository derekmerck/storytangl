label: repartee_loop
scripts: script.yaml
domain_module: repartee_loop.domain
metadata:
  title: "Marmoset Island"
  stage_extent: {width: 320, height: 200}
  ui_preferences:
    - id: sprites-visible
      kind: boolean
      label: "Decorative sprites"
      help: "Show optional staged character art."
      default: true
      shortcut: F1
    - id: clerk-motion
      kind: enum
      label: "Clerk motion"
      help: "Choose the clerk's local sprite pose."
      values: [idle, call, response]
      default: idle
      shortcut: F2
  description: "A compact compiled-world proof of call-response acquisition and opportunity gating."
