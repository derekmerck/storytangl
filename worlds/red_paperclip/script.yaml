label: red_paperclip

metadata:
  title: "One Red Paperclip"
  description: "Trade up, or trade yourself into a corner."
  start_at: district.intro

scenes:
  district:
    title: "One Red Paperclip"
    blocks:
      intro:
        content: |
          You have a red paperclip. Somebody in this district will take it off
          you and give you something better, and somebody will take that.

          Keep going until nobody wants what you are holding. Whatever that
          turns out to be is how the story ends, so choose the corner you get
          stuck in.
        actions:
          - text: "Take the paperclip and go"
            successor: road

      # The road is the map: standing here is standing on it, and travel is
      # ordinary choices. The plate names six regions; each hub below claims
      # one, and neither knows the other's claim.
      road:
        kind: "red_paperclip.domain.RedPaperclipHub"
        location_name: "The Road"
        map:
          name: district
          plate: district_map.png
          regions:
            station: {x: 0.05, y: 0.06, w: 0.26, h: 0.20}
            campus: {x: 0.66, y: 0.08, w: 0.28, h: 0.22}
            market: {x: 0.36, y: 0.36, w: 0.28, h: 0.22}
            garage: {x: 0.70, y: 0.44, w: 0.25, h: 0.20}
            harbor: {x: 0.04, y: 0.60, w: 0.30, h: 0.30}
            airfield: {x: 0.60, y: 0.72, w: 0.34, h: 0.22}
        content: |
          One loop of road, six places on it, and {holding_name} in your hand.

      harbor:
        kind: "red_paperclip.domain.RedPaperclipHub"
        location_name: "Sandpoint Harbour"
        plates: [district:harbor]
        links:
          out:
            target: road
            text: "Back to the road"
        content: |
          Working boats, a fuel dock, and the harbourmaster's office at the
          top of the ramp. Everything here is for mending something else.

      market:
        kind: "red_paperclip.domain.RedPaperclipHub"
        location_name: "Ferryman's Market"
        plates: [district:market]
        links:
          out:
            target: road
            text: "Back to the road"
        content: |
          Tarps on trestle tables, a bakery stall going empty, and a cafe
          being taken apart into boxes.

      garage:
        kind: "red_paperclip.domain.RedPaperclipHub"
        location_name: "The Ring Road Garage"
        plates: [district:garage]
        links:
          out:
            target: road
            text: "Back to the road"
        content: |
          Three bays, a parts room nobody else can navigate, and a yard of
          things that will be worth something to somebody.

      campus:
        kind: "red_paperclip.domain.RedPaperclipHub"
        location_name: "Miller College"
        plates: [district:campus]
        links:
          out:
            target: road
            text: "Back to the road"
        content: |
          A quad, a bike rack that is more bicycles than rack, and a film
          society four days behind schedule.

      station:
        kind: "red_paperclip.domain.RedPaperclipHub"
        location_name: "The Rail Halt"
        plates: [district:station]
        links:
          out:
            target: road
            text: "Back to the road"
        content: |
          Two platforms, a freight dock signing for things nobody ordered,
          and a lost-property window that is usually shut.

      airfield:
        kind: "red_paperclip.domain.RedPaperclipHub"
        location_name: "The Grass Airfield"
        plates: [district:airfield]
        links:
          out:
            target: road
            text: "Back to the road"
        content: |
          A mown strip, two hangars, and a windsock that has been busy all
          week. Things leave from here.

      ending:
        content: |
          And that is where the trading stopped.
