label: concept_naming_demo
globals:
  link_prose: false
  naming_defaults:
    Actor: concealed
    Location: proper
    NamedSword: concealed
  sword_spec:
    label: sword
    name: Dawnblade
    anonymous_name: an old sword
    proper_forms: {inscription: Dawnblade of the East}
actors:
  rin:
    kind: PersonalNamedActor
    name: Rin
    anonymous_name: the blonde girl
    personal_name:
      given_name: Rin
      family_name: Northstar
      nickname: Rinnie
      title: Ms.
  beth:
    kind: NamedActor
    name: Beth
    anonymous_name: the dark-haired girl
  nanae:
    kind: NamedActor
    name: Nanae
    anonymous_name: the brunette girl
locations:
  square:
    kind: NamedLocation
    name: Market Square
  hideout:
    kind: NamedLocation
    name: Rin's Hideout
    anonymous_name: a hidden room
    naming_policy: concealed
scenes:
  meeting:
    roles:
      host: {actor_ref: rin}
      sister: {actor_ref: nanae}
    settings:
      place: {location_ref: square}
    blocks:
      start:
        content: You arrive.
        actions:
          - {text: Meet the girl, successor: introduction}
          - {text: Introduce before prose, successor: effect_introduction}
          - {text: Read linked narration, successor: linked.start}
      effect_introduction:
        kind: ProseBlock
        pre_effects: ["introduce(host)"]
        prose:
          - dialog_class: host
            text: ["This is my sister, Nanae."]
        actions:
          - {text: Continue, successor: later.start}
      introduction:
        kind: ProseBlock
        prose:
          - text: [{ref: host}, " approaches at ", {ref: place}, "."]
          - dialog_class: host
            text: ["Hi, I am ", {ref: host, introduce: true}, "."]
          - text: [{ref: host}, " smiles."]
          - dialog_class: host
            template: "{{ reference(host, 'anonymous') }} is still an available description."
        actions:
          - label: greet_host
            text: Greet the host
            successor: later.start
        choice_labels:
          greet_host: ["Say hi to ", {ref: host}]
  later:
    roles:
      host: {actor_ref: rin}
    blocks:
      start:
        kind: ProseBlock
        prose:
          - template: "Hello again, {{ reference(host) }}."
          - text: ["You find ", {ref: sword, params: {form: inscription}}, "."]
          - text: ["Its inscription reads ", {ref: sword, introduce: true, params: {form: inscription}}, "."]
          - template: "You carry {{ reference(sword) }}."
        actions:
          - {text: Return, successor: meeting.introduction}
  linked:
    locals: {link_prose: true}
    roles:
      host: {actor_ref: rin}
      sister: {actor_ref: nanae}
    settings:
      place: {location_ref: square}
    blocks:
      start:
        kind: ProseBlock
        prose:
          - text: |
              Rin waits at Market Square beside Dawnblade.

              > [!npc|host_role.excited]
              > This is my sister, Nanae. Rin #intro stays spoken.

              Nanae #intro smiles. Nanae waves. Rin#intro nods.

              > [!npc|host_role.happy]
              > Nanae #intro remains literal speech.

              Dawnblade of the East #intro gleams. Dawnblade rests here.
        actions:
          - {label: greet_host, text: Continue, successor: after}
        choice_labels:
          greet_host: ["Say hi to ", {ref: host}]
      after:
        kind: ProseBlock
        prose:
          - text: "Rin and Nanae remember Market Square and Dawnblade."
        actions:
          - {text: Return to linked narration, successor: start}
      opted_out:
        kind: ProseBlock
        locals: {link_prose: false}
        prose:
          - text: "Rin #intro remains literal."
          - template: "{{ reference(host, 'proper') }}"
      shadow:
        kind: ProseBlock
        roles:
          host: {actor_ref: beth}
        prose:
          - text: "Beth waits. Rin remains source-literal."
