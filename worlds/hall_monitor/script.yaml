label: hall_monitor

metadata:
  title: "Hall Monitor"
  description: "Run a morning hallway shift with school-specific passes and rulings."
  start_at: halls.entrance

scenes:
  halls:
    title: "Main Hall"
    blocks:
      entrance:
        media:
          - name: hallway_bg.png
            media_role: narrative_im
            staging_hints:
              media_shape: landscape
        content: |
          The warning bell has rung. Students begin moving between classrooms,
          activities, and the front office.
        actions:
          - text: "Monitor the morning halls"
            successor: morning_shift

      morning_shift:
        media:
          - name: hall_desk_bg.png
            media_role: narrative_im
            staging_hints:
              media_shape: landscape
        kind: "hall_monitor.domain.HallMonitorBlock"
        # A school hall desk: shorter than the checkpoint counter and dressed
        # for two documents rather than four. Same contract, different
        # furniture -- which is the point of declaring it per block.
        surface:
          name: hall_desk
          band: {x: 0.0, y: 0.66, w: 1.0, h: 0.34}
          slots:
            student:  {holds: candidate, x: 0.32, y: 0.54, w: 0.34, h: 0.10}
            pass_id:  {holds: id_card,   x: 0.08, y: 0.70, w: 0.24, h: 0.24}
            note:     {holds: document,  x: 0.38, y: 0.70, w: 0.24, h: 0.24}
            permit:   {holds: permit,    x: 0.68, y: 0.70, w: 0.24, h: 0.24}
        encounters: 5
        disposition_distribution:
          pass: 0.50
          deny: 0.30
          arrest: 0.20
        seed: 20260719
        content: |
          Check each student’s identification and pass before deciding whether
          to allow them onward, send them back to class, or refer them to office.
        continues:
          - successor: victory
            trigger: last
            predicate: game_won
          - successor: defeat
            trigger: last
            predicate: game_lost

      victory:
        media:
          - name: hallway_bg.png
            media_role: narrative_im
            staging_hints:
              media_shape: landscape
        content: |
          The morning bell settles the halls. Every student was handled correctly.
        actions:
          - text: "Read the attendance note"
            successor: attendance_note

      defeat:
        media:
          - name: hallway_bg.png
            media_role: narrative_im
            staging_hints:
              media_shape: landscape
        content: |
          The passing period ends with an unresolved mistake on the attendance sheet.
        actions:
          - text: "Read the attendance note"
            successor: attendance_note

      attendance_note:
        media:
          - name: hall_desk_bg.png
            media_role: narrative_im
            staging_hints:
              media_shape: landscape
        kind: "hall_monitor.domain.HallMonitorConsequenceBlock"
        content: |
          The attendance office has filed one note from the morning shift.

      returning_student:
        media:
          - name: hall_desk_bg.png
            media_role: narrative_im
            staging_hints:
              media_shape: landscape
        kind: "hall_monitor.domain.HallMonitorReturnBlock"
        content: |
          A student waits at the hall desk with new paperwork.
        continues:
          - successor: return_complete
            trigger: last
            predicate: game_won
          - successor: return_complete
            trigger: last
            predicate: game_lost

      return_complete:
        media:
          - name: hallway_bg.png
            media_role: narrative_im
            staging_hints:
              media_shape: landscape
        content: |
          The final bell rings across the now-quiet hall.
