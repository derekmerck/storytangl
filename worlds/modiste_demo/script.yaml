label: modiste_demo
scenes:
  studio:
    blocks:
      catalogue:
        kind: ModisteDesk
        render_png: true
        prose:
          - template: >-
              Outfit: {{ modiste_outfit }}. Palette: {{ modiste_palette }}.
              Parts: {{ modiste_parts }}. Bindings: {{ modiste_bindings }}.
              Plan: {{ modiste_plan_id }}.
              {% if modiste_diagnostics %}Diagnostics: {{ modiste_diagnostics }}.{% endif %}
              The catalogue displays the selected assembled figure when available.
        actions:
          - {label: underwear, text: Select underwear, successor: catalogue}
          - {label: camisole, text: Select camisole, successor: catalogue}
          - {label: rose, text: Select rose palette, successor: catalogue}
          - {label: blue, text: Select blue palette, successor: catalogue}
